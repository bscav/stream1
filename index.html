<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  #player { position:fixed; inset:0; width:100%; height:100%; }
</style>
</head>
<body>
<div id="player"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
  var player;
  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      width: '100%', height: '100%',
      videoId: 'E1Ws47Dwric',
      playerVars: { autoplay: 1, mute: 1, controls: 0, rel: 0, modestbranding: 1, playsinline: 1 },
      events: {
        onReady: function (e) { e.target.mute(); e.target.playVideo(); },
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.PLAYING) {
            try { e.target.unMute(); e.target.setVolume(100); } catch (err) {}
          }
        }
      }
    });
  }
  // Retry if the player gets stuck
  setInterval(function () {
    if (player && player.getPlayerState && player.getPlayerState() !== 1) player.playVideo();
  }, 5000);
</script>
</body>
</html>
